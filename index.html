<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>카트 레이서</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1b2a1b; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #c { pointer-events: none; z-index: 2; }
  #gl { z-index: 1; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(90deg, rgba(8,12,20,0.78), rgba(8,12,20,0.25)); z-index: 10; padding: 16px; }
  .hidden { display: none !important; }
  .panel { background: linear-gradient(160deg, #1e3c72, #2a5298); border: 3px solid #ffd23f; border-radius: 18px; padding: 24px 28px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.5); text-align: center; }
  h1 { font-size: clamp(32px, 7vw, 52px); letter-spacing: 2px; color: #ffd23f; text-shadow: 3px 3px 0 #d7263d, 6px 6px 0 rgba(0,0,0,.35); font-style: italic; }
  .sub { margin: 6px 0 18px; opacity: .85; }
  h2 { font-size: 16px; margin: 16px 0 8px; color: #ffd23f; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .opt { background: rgba(255,255,255,.12); border: 2px solid transparent; color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .opt.sel { border-color: #ffd23f; background: rgba(255,210,63,.22); }
  .swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
  .go { margin-top: 20px; background: #d7263d; color: #fff; border: none; border-radius: 12px; padding: 12px 40px; font-size: 22px; font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 0 5px 0 #8c1426; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #8c1426; }
  .go.alt { background: #3a6ea5; box-shadow: 0 5px 0 #1f4369; }
  .keys { margin-top: 18px; font-size: 13px; line-height: 1.8; opacity: .9; text-align: left; display: inline-block; }
  kbd { background: #fff; color: #222; border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 12px; font-weight: bold; box-shadow: 0 2px 0 #999; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }
  td, th { padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,.15); }
  tr.me { background: rgba(255,210,63,.25); font-weight: bold; }
  #touch { position: fixed; inset: auto 0 0 0; height: 46%; pointer-events: none; z-index: 5; }
  #touch .tb { position: absolute; pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.45); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; color: #fff; }
  #touch .tb.on { background: rgba(255,210,63,.5); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>KART RACER</h1>
    <div class="sub">드리프트로 부스터를 모아 1등을 노려라!</div>
    <h2>트랙</h2>
    <div class="row" id="trackSel"></div>
    <h2>카트 색상</h2>
    <div class="row" id="colorSel"></div>
    <h2>난이도</h2>
    <div class="row" id="diffSel"></div>
    <button class="go" id="startBtn">레이스 시작</button>
    <div>
      <div class="keys">
        <kbd>↑</kbd> 가속 &nbsp; <kbd>↓</kbd> 브레이크/후진 &nbsp; <kbd>←</kbd><kbd>→</kbd> 조향<br>
        <kbd>Shift</kbd> 드리프트 (방향키와 함께) — 부스터 게이지 충전<br>
        <kbd>Ctrl</kbd> 또는 <kbd>Z</kbd> 니트로 부스터 사용<br>
        드리프트를 0.4초 이상 유지하고 떼면 <b>순간 부스터</b>!<br>
        출발 신호(GO) 직전에 <kbd>↑</kbd>를 누르면 <b>출발 부스터</b>!<br>
        <kbd>R</kbd> 재시작 &nbsp; <kbd>Esc</kbd> 메뉴 &nbsp; <kbd>M</kbd> 소리 켜기/끄기
      </div>
    </div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="panel">
    <h1 id="resTitle">FINISH!</h1>
    <table id="resTable"></table>
    <div class="row">
      <button class="go" id="againBtn">다시 하기</button>
      <button class="go alt" id="menuBtn">메뉴</button>
    </div>
  </div>
</div>

<div id="touch" class="hidden">
  <div class="tb" data-k="left" style="left:16px;bottom:96px">◀</div>
  <div class="tb" data-k="right" style="left:104px;bottom:96px">▶</div>
  <div class="tb" data-k="down" style="left:60px;bottom:14px">▼</div>
  <div class="tb" data-k="up" style="right:16px;bottom:14px;width:86px;height:86px">가속</div>
  <div class="tb" data-k="drift" style="right:116px;bottom:22px">드리프트</div>
  <div class="tb" data-k="boost" style="right:40px;bottom:116px">부스터</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ===================== 기본 설정 =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (window.__gfx) window.__gfx.resize(VW, VH, window.devicePixelRatio || 1);
}
window.addEventListener('resize', resize);
resize();

const ROAD = 210;         // 도로 폭
const FENCE = 70;         // 도로 끝에서 펜스까지 거리
const SPACING = 20;       // 트랙 샘플 간격
const LAPS = 3;
const MAX_SPEED = 540;
const ACCEL = 360;
const BRAKE = 700;
const REVERSE = 160;
const KART_R = 15;

const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => { while (a > PI) a -= TAU; while (a < -PI) a += TAU; return a; };
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;

// ===================== 트랙 =====================
const TRACKS = [
  {
    name: '숲속 서킷', props: 'forest',
    theme: { ground: 'grass', skyTop: '#3f74c4', skyMid: '#9cc3e8', horizon: '#d6e6f0', fog: '#c9dbe6', hemiSky: '#cfe3ff', hemiGround: '#4d5e36', hemi: 0.7, sun: '#fff1dc', sunI: 1.7, mountain: '#6d8a86', shoulder: '#5b4a36', dust: [0.42, 0.33, 0.22] },
    points: [[0,0],[900,-120],[1750,-40],[2350,380],[2450,1100],[1950,1520],[1300,1320],[880,1700],[1120,2320],[620,2760],[-220,2560],[-560,1840],[-240,1220],[-760,720],[-560,120]],
    pads: [[0.04, 0], [0.41, -45], [0.76, 45]]
  },
  {
    name: '사막 캐니언', props: 'desert',
    theme: { ground: 'sand', skyTop: '#2f6fbf', skyMid: '#8fbfe6', horizon: '#f0dcbc', fog: '#e9d6b6', hemiSky: '#d8e8ff', hemiGround: '#a07a4c', hemi: 0.75, sun: '#ffe7c4', sunI: 1.9, mountain: '#b0603a', shoulder: '#a7804f', dust: [0.78, 0.62, 0.42] },
    points: [[0,0],[1300,0],[2150,220],[2480,760],[2120,1200],[1450,1080],[1000,1420],[1350,1860],[2200,1950],[2560,2480],[2000,3050],[850,3050],[0,2700],[-460,2050],[160,1600],[-360,950],[-460,320]],
    pads: [[0.05, 0], [0.35, 45], [0.65, -45], [0.95, 0]]
  },
  {
    name: '설원 스피드웨이', props: 'snow',
    theme: { ground: 'snow', skyTop: '#6584a8', skyMid: '#b5c7da', horizon: '#e3e9ef', fog: '#dde4eb', hemiSky: '#dfe8f5', hemiGround: '#b8c4d0', hemi: 0.85, sun: '#fff6ec', sunI: 1.2, mountain: '#e8eef4', shoulder: '#8a8f96', dust: [0.95, 0.97, 1.0] },
    points: [[0,0],[1600,0],[2500,300],[2800,1000],[2500,1700],[1600,2000],[0,2000],[-900,1700],[-1200,1000],[-900,300]],
    pads: [[0.03, 0], [0.31, 0], [0.6, 0]]
  }
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}

function buildTrack(def) {
  const cp = def.points, n = cp.length;
  const dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = cp[(i - 1 + n) % n], p1 = cp[i], p2 = cp[(i + 1) % n], p3 = cp[(i + 2) % n];
    const steps = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 4);
    for (let s = 0; s < steps; s++) dense.push(catmull(p0, p1, p2, p3, s / steps));
  }
  dense.push(dense[0]);
  // 일정 간격으로 재샘플링
  const pts = [[dense[0][0], dense[0][1]]];
  let acc = 0;
  for (let i = 1; i < dense.length; i++) {
    let [ax, ay] = dense[i - 1];
    const [bx, by] = dense[i];
    let seg = Math.hypot(bx - ax, by - ay);
    while (acc + seg >= SPACING) {
      const t = (SPACING - acc) / seg;
      ax = ax + (bx - ax) * t; ay = ay + (by - ay) * t;
      pts.push([ax, ay]);
      seg = Math.hypot(bx - ax, by - ay);
      acc = 0;
    }
    acc += seg;
  }
  if (Math.hypot(pts[pts.length - 1][0] - pts[0][0], pts[pts.length - 1][1] - pts[0][1]) < SPACING * 0.5) pts.pop();
  const N = pts.length;
  const ang = new Float32Array(N), nx = new Float32Array(N), ny = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
    const a2 = Math.atan2(b[1] - a[1], b[0] - a[0]);
    ang[i] = a2; nx[i] = -Math.sin(a2); ny[i] = Math.cos(a2);
  }
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) { minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]); maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); }
  const path = new Path2D();
  path.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < N; i++) path.lineTo(pts[i][0], pts[i][1]);
  path.closePath();

  const tr = { def, pts, N, ang, nx, ny, path, minX, minY, maxX, maxY };
  // 부스터 패드 (트랙 진행 비율, 횡 오프셋)
  tr.pads = def.pads.map(([pct, off]) => ({ idx: Math.floor(pct * N) % N, off }));
  // 곡률 (부호: 안쪽 방향), 커브 안쪽 면
  tr.curv = new Float32Array(N); tr.inner = new Int8Array(N);
  for (let i = 0; i < N; i++) {
    tr.curv[i] = wrapA(ang[(i + 4) % N] - ang[(i - 4 + N) % N]) / (8 * SPACING);
    const a = pts[(i - 3 + N) % N], b = pts[i], c = pts[(i + 3) % N];
    const ax = a[0] - 2 * b[0] + c[0], ay = a[1] - 2 * b[1] + c[1];
    tr.inner[i] = ax * nx[i] + ay * ny[i] >= 0 ? 1 : -1;
  }
  // 자연물 배치
  let seed = 1234 + def.name.length * 97;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  tr.props = [];
  const minD = ROAD / 2 + FENCE + 50;
  for (let tries = 0; tries < 9000 && tr.props.length < 900; tries++) {
    const x = lerp(minX - 1400, maxX + 1400, rnd()), y = lerp(minY - 1400, maxY + 1400, rnd());
    let d = Infinity;
    for (let i = 0; i < N; i += 2) { const dx = pts[i][0] - x, dy = pts[i][1] - y; d = Math.min(d, dx * dx + dy * dy); }
    d = Math.sqrt(d);
    if (d < minD || d > 1500) continue;
    if (Math.hypot(x - pts[6][0], y - pts[6][1]) < 420) continue; // 관중석 자리
    const s = 0.7 + rnd() * 1.1, rot = rnd() * 6;
    if (def.props === 'forest') {
      if (rnd() < 0.55) tr.props.push({ kind: 'pine', x, y, s, rot, col: pick(['#2f5a2a', '#36652c', '#284f27', '#3c6b30']), col2: pick(['#3a6b31', '#447536', '#315d2c']) });
      else tr.props.push({ kind: 'round', x, y, s, rot, col: pick(['#4f7f2f', '#5d8c34', '#3f6f2a', '#6a8f3a', '#7b9a3c']) });
    } else if (def.props === 'desert') {
      if (rnd() < 0.6) tr.props.push({ kind: 'rock', x, y, s: s * 1.2, rot, col: pick(['#b5683f', '#a65a35', '#c47a4a', '#9a5233', '#cf9466']) });
      else tr.props.push({ kind: 'shrub', x, y, s, rot, col: pick(['#7c7a3c', '#8a8a48', '#6d6a34']) });
    } else {
      tr.props.push({ kind: 'pine', x, y, s, rot, col: pick(['#2c4a3c', '#355546', '#e6edf2']), col2: pick(['#eef3f7', '#dfe8ee', '#ffffff']) });
    }
  }
  return tr;
}

// 트랙 위의 위치 찾기 (hint 주변 지역 탐색)
function locate(tr, x, y, hint) {
  const N = tr.N, pts = tr.pts;
  let best = 0, bd = Infinity;
  if (hint < 0) {
    for (let i = 0; i < N; i++) { const dx = pts[i][0] - x, dy = pts[i][1] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  } else {
    for (let k = -45; k <= 45; k++) {
      const i = (hint + k + N) % N;
      const dx = pts[i][0] - x, dy = pts[i][1] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
  }
  const off = (x - pts[best][0]) * tr.nx[best] + (y - pts[best][1]) * tr.ny[best];
  return { idx: best, off };
}

// ===================== 오디오 =====================
const Sound = {
  ctx: null, master: null, eng: null, engGain: null, engFilter: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      this.ctx = new A();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.35; this.master.connect(this.ctx.destination);
      this.eng = this.ctx.createOscillator(); this.eng.type = 'sawtooth'; this.eng.frequency.value = 60;
      this.engFilter = this.ctx.createBiquadFilter(); this.engFilter.type = 'lowpass'; this.engFilter.frequency.value = 600;
      this.engGain = this.ctx.createGain(); this.engGain.gain.value = 0;
      this.eng.connect(this.engFilter); this.engFilter.connect(this.engGain); this.engGain.connect(this.master);
      this.eng.start();
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, len);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.35; },
  engine(speed, on) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.eng.frequency.setTargetAtTime(55 + Math.abs(speed) * 0.32, t, 0.05);
    this.engFilter.frequency.setTargetAtTime(500 + Math.abs(speed) * 1.5, t, 0.05);
    this.engGain.gain.setTargetAtTime(on ? 0.12 : 0, t, 0.1);
  },
  beep(freq, dur, type = 'square', vol = 0.25) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur);
  },
  whoosh(dur = 0.8, vol = 0.5, f = 900) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), bp = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise; bp.type = 'bandpass'; bp.frequency.setValueAtTime(f, t); bp.frequency.exponentialRampToValueAtTime(f * 3, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur);
  },
  bump() { this.beep(90, 0.15, 'triangle', 0.4); },
  skidOn: false,
};

// ===================== 입력 =====================
const input = { up: false, down: false, left: false, right: false, drift: false, boost: false };
let boostPressed = false, upPressTime = -1;
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ShiftLeft: 'drift', ShiftRight: 'drift', ControlLeft: 'boost', ControlRight: 'boost', KeyZ: 'boost'
};
function setKey(k, v) {
  if (k === 'boost' && v && !input.boost) boostPressed = true;
  if (k === 'up' && v && !input.up) upPressTime = performance.now();
  input[k] = v;
}
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { setKey(k, true); e.preventDefault(); }
  if (e.code === 'KeyR' && game.state !== 'menu') startRace();
  if (e.code === 'Escape') showMenu();
  if (e.code === 'KeyM') Sound.toggle();
  if ((e.code === 'Enter' || e.code === 'Space') && game.state === 'menu') { e.preventDefault(); startRace(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { setKey(k, false); e.preventDefault(); } });
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });

// 터치 버튼
const touchEl = document.getElementById('touch');
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  touchEl.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); Sound.init(); setKey(k, true); b.classList.add('on'); };
    const off = e => { e.preventDefault(); setKey(k, false); b.classList.remove('on'); };
    b.addEventListener('touchstart', on); b.addEventListener('touchend', off); b.addEventListener('touchcancel', off);
  });
}

// ===================== 게임 상태 =====================
const COLORS = ['#d7263d', '#1b98e0', '#f4d35e', '#2ec4b6', '#9b5de5', '#ff7f11'];
const BOT_NAMES = ['다오', '배찌', '디지니', '모스', '케피'];
const DIFFS = [{ name: '쉬움', skill: 0.86 }, { name: '보통', skill: 0.95 }, { name: '어려움', skill: 1.02 }];
const settings = { track: 0, color: 0, diff: 1 };
try { Object.assign(settings, JSON.parse(localStorage.getItem('kart.settings') || '{}')); } catch (e) {}

const game = {
  state: 'menu', track: null, karts: [], player: null, time: 0, countdown: 0,
  cam: { h: 0, fov: 60 }, particles: [], messages: [], resultTimer: 0, finishOrder: []
};

function makeKart(name, color, isPlayer) {
  return {
    name, color, isPlayer, x: 0, y: 0, h: 0, vx: 0, vy: 0, fwd: 0,
    idx: 0, lap: 0, maxLap: 0, lapStart: 0, lapTimes: [], finished: false, finishTime: 0,
    gauge: 0, nitro: 0, boost: 0, boostKind: '', drift: false, driftDir: 0, driftTime: 0, onRoad: true,
    steerVis: 0, wrongWay: 0, bumpCd: 0,
    ai: isPlayer ? null : { offset: 0, offTarget: 0, offTimer: 0, skill: 1, stuck: 0, reverse: 0, nitroDelay: 2 + Math.random() * 3 }
  };
}

function startRace() {
  Sound.init();
  try { localStorage.setItem('kart.settings', JSON.stringify(settings)); } catch (e) {}
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) touchEl.classList.remove('hidden');
  setupRace();
  game.countdown = 3.999; game.state = 'countdown';
}

const trackCache = [];
function setupRace() {
  const tr = game.track = trackCache[settings.track] || (trackCache[settings.track] = buildTrack(TRACKS[settings.track]));
  game.karts = [];
  const player = makeKart('나', COLORS[settings.color], true);
  const botColors = COLORS.filter((_, i) => i !== settings.color);
  const names = BOT_NAMES.slice().sort(() => Math.random() - 0.5);
  const bots = [];
  for (let i = 0; i < 5; i++) {
    const b = makeKart(names[i], botColors[i], false);
    b.ai.skill = DIFFS[settings.diff].skill * (0.95 + i * 0.022);
    b.ai.offTarget = b.ai.offset = (Math.random() - 0.5) * 80;
    bots.push(b);
  }
  // 그리드: 플레이어는 맨 뒤 줄 근처에서 출발
  const grid = [bots[4], bots[3], bots[2], bots[1], player, bots[0]];
  grid.forEach((k, i) => {
    const row = Math.floor(i / 2), col = i % 2;
    const idx = (tr.N - 4 - row * 4) % tr.N;
    const off = col === 0 ? -45 : 45;
    k.x = tr.pts[idx][0] + tr.nx[idx] * off;
    k.y = tr.pts[idx][1] + tr.ny[idx] * off;
    k.h = tr.ang[idx];
    k.idx = idx;
    game.karts.push(k);
  });
  game.player = player;
  game.time = 0;
  game.particles = []; game.messages = []; game.finishOrder = []; game.resultTimer = 0;
  Gfx.clearSkids();
  game.lastCount = 4;
  game.cam.h = player.h; game.cam.fov = 60;
  Gfx.setTrack(tr); Gfx.setKarts(game.karts);
  game.best = loadBest();
}

function loadBest() { try { return parseFloat(localStorage.getItem('kart.best.' + settings.track)) || 0; } catch (e) { return 0; } }
function saveBest(t) { try { localStorage.setItem('kart.best.' + settings.track, String(t)); } catch (e) {} }

function showMenu() {
  game.state = 'menu';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  touchEl.classList.add('hidden');
  Sound.engine(0, false);
  buildMenu();
  setupRace();
}

function message(text, color = '#ffd23f', dur = 1.2) { game.messages.push({ text, color, t: dur, dur }); }

// ===================== AI =====================
function aiInput(k, dt) {
  const tr = game.track, N = tr.N, ai = k.ai;
  ai.offTimer -= dt;
  if (ai.offTimer <= 0) { ai.offTimer = 1.5 + Math.random() * 2.5; ai.offTarget = (Math.random() - 0.5) * 100; }
  ai.offset = lerp(ai.offset, ai.offTarget, dt * 0.8);
  const look = 7 + Math.floor(Math.max(0, k.fwd) / 45);
  const ti = (k.idx + look) % N;
  // 코너 안쪽으로 붙도록 곡률 반영
  const curveAhead = wrapA(tr.ang[(k.idx + 35) % N] - tr.ang[k.idx]);
  const off = clamp(ai.offset - curveAhead * 40, -ROAD / 2 + 25, ROAD / 2 - 25);
  const tx = tr.pts[ti][0] + tr.nx[ti] * off, ty = tr.pts[ti][1] + tr.ny[ti] * off;
  const diff = wrapA(Math.atan2(ty - k.y, tx - k.x) - k.h);
  const inp = { up: true, down: false, steer: clamp(diff * 2.6, -1, 1), drift: false, boost: false };

  // 고무줄 효과 (플레이어와의 거리)
  const p = game.player;
  const gap = (k.lap * N + k.idx) - (p.lap * N + p.idx);
  let skill = ai.skill;
  if (!p.finished) { if (gap > N * 0.12) skill *= 0.93; else if (gap < -N * 0.15) skill *= 1.06; }
  k.topMul = skill;

  const sharp = Math.abs(wrapA(tr.ang[(k.idx + 28) % N] - tr.ang[(k.idx + 6) % N]));
  const target = MAX_SPEED * skill * (1 - Math.min(0.42, sharp * 0.33));
  if (k.fwd > target + 25) { inp.up = false; if (k.fwd > target + 90) inp.down = true; }

  // 니트로 사용: 직선 구간
  ai.nitroDelay -= dt;
  k.gauge += dt * 9 * skill;
  if (k.gauge >= 100) { k.gauge -= 100; k.nitro = Math.min(2, k.nitro + 1); }
  if (k.nitro > 0 && sharp < 0.2 && ai.nitroDelay <= 0 && k.boost <= 0) { inp.boost = true; ai.nitroDelay = 2 + Math.random() * 4; }

  // 끼임 탈출
  if (ai.reverse > 0) { ai.reverse -= dt; inp.up = false; inp.down = true; inp.steer = -inp.steer; }
  else if (game.state === 'race' && Math.abs(k.fwd) < 30) { ai.stuck += dt; if (ai.stuck > 1.2) { ai.reverse = 0.9; ai.stuck = 0; } }
  else ai.stuck = 0;
  return inp;
}

function playerInput(k) {
  const inp = {
    up: input.up, down: input.down,
    steer: (input.right ? 1 : 0) - (input.left ? 1 : 0),
    drift: input.drift, boost: boostPressed
  };
  boostPressed = false;
  k.topMul = 1;
  return inp;
}

// ===================== 물리 =====================
function updateKart(k, inp, dt) {
  const tr = game.track;
  if (k.boost > 0) inp.up = true;
  // 조향
  const sf = clamp(Math.abs(k.fwd) / 170, 0, 1) * (k.fwd < -5 ? -1 : 1);
  let turn;
  if (k.drift) turn = (k.driftDir * 1.25 + inp.steer * 0.95) * sf;
  else turn = inp.steer * 2.55 * sf * (1 - Math.min(0.3, Math.abs(k.fwd) / MAX_SPEED * 0.3));
  k.h += turn * dt;
  k.steerVis = lerp(k.steerVis, inp.steer, dt * 10);

  const fx = Math.cos(k.h), fy = Math.sin(k.h), rx = -fy, ry = fx;
  let fwd = k.vx * fx + k.vy * fy, lat = k.vx * rx + k.vy * ry;

  // 최고 속도
  let top = MAX_SPEED * (k.topMul || 1);
  if (!k.onRoad) top *= 0.5;
  if (k.boost > 0) top *= k.boostKind === 'nitro' ? 1.5 : 1.3;

  if (inp.up) {
    if (fwd < top) fwd += (k.boost > 0 ? ACCEL * 2.5 : ACCEL) * dt * (1 - Math.max(0, fwd) / top * 0.55);
  } else if (inp.down) {
    if (fwd > 0) fwd -= BRAKE * dt; else if (fwd > -REVERSE) fwd -= ACCEL * 0.6 * dt;
  } else {
    fwd -= sign(fwd) * Math.min(Math.abs(fwd), 140 * dt);
  }
  if (fwd > top) fwd -= (fwd - top) * Math.min(1, (k.onRoad ? 1.2 : 3.5) * dt);

  // 드리프트
  if (!k.drift && inp.drift && inp.steer !== 0 && fwd > 200) {
    k.drift = true; k.driftDir = inp.steer; k.driftTime = 0;
    lat -= inp.steer * 40; // 뒤가 미끄러지는 느낌
  }
  if (k.drift) {
    k.driftTime += dt;
    fwd -= fwd * 0.12 * dt;
    if (!inp.drift || fwd < 120) {
      k.drift = false;
      if (k.driftTime > 0.4 && fwd > 150) {
        k.boost = Math.max(k.boost, 0.45); k.boostKind = 'mini';
        if (k.isPlayer) { Sound.whoosh(0.35, 0.25, 1200); message('순간 부스터!', '#7fdcff', 0.7); }
      }
    } else if (k.onRoad) {
      k.gauge += (Math.abs(lat) * 0.09 + 7) * dt;
      if (k.gauge >= 100) {
        if (k.nitro < 2) { k.nitro++; k.gauge -= 100; if (k.isPlayer) Sound.beep(880, 0.15, 'square', 0.15); }
        else k.gauge = 100;
      }
    }
  }
  const grip = k.drift ? 2.4 : (k.onRoad ? 9 : 6);
  const latLoss = Math.abs(lat) * (1 - Math.exp(-grip * dt));
  lat *= Math.exp(-grip * dt);
  // 드리프트 중 미끄러지는 속도 일부를 전진 속도로 되돌려 속도 유지
  if (k.drift && fwd < top) fwd += latLoss * 0.7;

  // 니트로
  if (inp.boost && k.nitro > 0 && game.state === 'race') {
    k.nitro--; k.boost = 1.9; k.boostKind = 'nitro';
    fwd = Math.max(fwd, MAX_SPEED * 0.9);
    if (k.isPlayer) { Sound.whoosh(1.0, 0.55, 700); message('부스터!', '#ff7f11', 0.8); }
  }
  k.boost = Math.max(0, k.boost - dt);

  k.vx = fx * fwd + rx * lat; k.vy = fy * fwd + ry * lat; k.fwd = fwd; k.lat = lat;
  k.x += k.vx * dt; k.y += k.vy * dt;

  // 트랙 위치
  const prev = k.idx;
  const loc = locate(tr, k.x, k.y, k.idx);
  k.idx = loc.idx;
  k.onRoad = Math.abs(loc.off) < ROAD / 2 + 4;
  // 펜스 충돌
  const lim = ROAD / 2 + FENCE - KART_R;
  if (Math.abs(loc.off) > lim) {
    const s = sign(loc.off), nX = tr.nx[k.idx] * s, nY = tr.ny[k.idx] * s;
    const over = Math.abs(loc.off) - lim;
    k.x -= nX * over; k.y -= nY * over;
    const vn = k.vx * nX + k.vy * nY;
    if (vn > 0) {
      k.vx -= nX * vn * 1.25; k.vy -= nY * vn * 1.25;
      k.vx *= 0.82; k.vy *= 0.82;
      k.fwd = k.vx * fx + k.vy * fy;
      if (k.isPlayer && vn > 120 && k.bumpCd <= 0) { Sound.bump(); k.bumpCd = 0.3; game.shake = Math.min(12, vn / 30); }
      k.drift = false;
    }
  }
  k.bumpCd -= dt;

  // 부스터 패드
  for (const pad of tr.pads) {
    let di = Math.abs(k.idx - pad.idx); di = Math.min(di, tr.N - di);
    if (di <= 2 && Math.abs(loc.off - pad.off) < 42) {
      if (k.boost < 0.5 && k.isPlayer) Sound.whoosh(0.5, 0.35, 1000);
      k.boost = Math.max(k.boost, 0.9); if (k.boostKind !== 'nitro') k.boostKind = 'pad';
    }
  }

  // 랩 계산
  const N = tr.N;
  if (prev > N * 0.75 && k.idx < N * 0.25) {
    k.lap++;
    if (k.lap > k.maxLap) {
      k.maxLap = k.lap;
      if (k.lap >= 2) k.lapTimes.push(game.time - k.lapStart);
      k.lapStart = game.time;
      if (k.lap > LAPS && !k.finished) {
        k.finished = true; k.finishTime = game.time; game.finishOrder.push(k);
        if (k.isPlayer) onPlayerFinish();
      } else if (k.isPlayer && k.lap >= 2) {
        const lt = k.lapTimes[k.lapTimes.length - 1];
        message(k.lap === LAPS ? '마지막 랩!' : `LAP ${k.lap}  (${fmt(lt)})`, k.lap === LAPS ? '#ff5d73' : '#ffd23f', 1.6);
        Sound.beep(660, 0.12); setTimeout(() => Sound.beep(990, 0.18), 120);
      }
    }
  } else if (prev < N * 0.25 && k.idx > N * 0.75) {
    k.lap--;
  }

  // 역주행 체크
  const along = Math.cos(wrapA(k.h - tr.ang[k.idx]));
  if (along < -0.4 && Math.abs(k.fwd) > 40) k.wrongWay += dt; else k.wrongWay = 0;

  // 이펙트: 스키드 마크 & 불꽃
  const rearX = k.x - fx * 13, rearY = k.y - fy * 13;
  const wl = [rearX + rx * 9, rearY + ry * 9], wr = [rearX - rx * 9, rearY - ry * 9];
  if ((k.drift || Math.abs(lat) > 120) && k.onRoad) {
    if (k.lastW) {
      Gfx.addSkid(k.lastW[0][0], k.lastW[0][1], wl[0], wl[1]);
      Gfx.addSkid(k.lastW[1][0], k.lastW[1][1], wr[0], wr[1]);
    }
    k.lastW = [wl, wr];
    if (Math.random() < 0.6) spawn(rearX, rearY, 3, (Math.random() - 0.5) * 40 + k.vx * 0.2, (Math.random() - 0.5) * 40 + k.vy * 0.2, 14, 0.9, 'smoke');
  } else k.lastW = null;
  if (k.boost > 0) {
    const exX = k.x - fx * 20 - rx * 6, exY = k.y - fy * 20 - ry * 6;
    for (let i = 0; i < 2; i++) spawn(exX + (Math.random() - 0.5) * 3, exY + (Math.random() - 0.5) * 3, 8.5,
      -fx * 160 + (Math.random() - 0.5) * 40 + k.vx * 0.7, -fy * 160 + (Math.random() - 0.5) * 40 + k.vy * 0.7, (Math.random() - 0.3) * 20, 0.22, k.boostKind === 'nitro' ? 'fire' : 'blue');
  }
  if (!k.onRoad && Math.abs(k.fwd) > 100 && Math.random() < 0.5) spawn(rearX, rearY, 3, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50, 18, 0.8, 'dirt');
}

function collideKarts() {
  const ks = game.karts;
  for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
    const a = ks[i], b = ks[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = KART_R * 2;
    if (d < min && d > 0.01) {
      const nx = dx / d, ny = dy / d, push = (min - d) / 2;
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const imp = -rv * 0.8;
        a.vx -= nx * imp * 0.5; a.vy -= ny * imp * 0.5; b.vx += nx * imp * 0.5; b.vy += ny * imp * 0.5;
        if ((a.isPlayer || b.isPlayer) && imp > 80) Sound.bump();
      }
    }
  }
}

function spawn(x, y, z, vx, vy, vz, life, kind) {
  if (game.particles.length > 1200) return;
  game.particles.push({ x, y, z, vx, vy, vz, life, max: life, kind });
}

function onPlayerFinish() {
  const p = game.player;
  const pos = game.finishOrder.indexOf(p) + 1;
  message(pos === 1 ? '1등! 우승!' : `${pos}등으로 완주!`, '#ffd23f', 3);
  Sound.beep(523, 0.2); setTimeout(() => Sound.beep(659, 0.2), 180); setTimeout(() => Sound.beep(784, 0.4), 360);
  if (!game.best || p.finishTime < game.best) { game.best = p.finishTime; saveBest(p.finishTime); game.newRecord = true; } else game.newRecord = false;
  game.resultTimer = 2.5;
}

function ranking() {
  const N = game.track.N;
  return game.karts.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1; if (b.finished) return 1;
    return (b.lap * N + b.idx) - (a.lap * N + a.idx);
  });
}

// ===================== 업데이트 =====================
function update(dt) {
  if (game.state === 'menu') return;
  if (game.state === 'countdown') {
    game.countdown -= dt;
    const c = Math.ceil(game.countdown);
    if (c !== game.lastCount) {
      game.lastCount = c;
      if (c > 0) Sound.beep(440, 0.2, 'square', 0.2);
    }
    if (game.countdown <= 0) {
      game.state = 'race'; game.goFlash = 1;
      Sound.beep(880, 0.4, 'square', 0.25);
      // 출발 부스터: GO 직전 0.5초 안에 가속키를 누른 경우
      const since = (performance.now() - upPressTime) / 1000;
      if (input.up && since < 0.5) {
        const p = game.player; p.boost = 1.2; p.boostKind = 'nitro'; p.fwd = 300;
        p.vx = Math.cos(p.h) * 300; p.vy = Math.sin(p.h) * 300;
        message('출발 부스터!', '#7fdcff', 1.2); Sound.whoosh(0.9, 0.5, 700);
      }
      for (const k of game.karts) if (!k.isPlayer && Math.random() < 0.35) { k.boost = 0.8; k.boostKind = 'pad'; }
    }
  }
  if (game.state === 'race' || game.state === 'finished') {
    game.time += dt;
    for (const k of game.karts) {
      let inp;
      if (k.isPlayer && !k.finished) inp = playerInput(k);
      else {
        if (k.isPlayer && !k.ai) k.ai = { offset: 0, offTarget: 0, offTimer: 0, skill: 0.85, stuck: 0, reverse: 0, nitroDelay: 99 };
        inp = aiInput(k, dt);
      }
      updateKart(k, inp, dt);
    }
    collideKarts();
    if (game.resultTimer > 0) {
      game.resultTimer -= dt;
      if (game.resultTimer <= 0) { game.state = 'finished'; showResults(); }
    }
    if (game.state === 'finished') { game.resultRefresh = (game.resultRefresh || 0) - dt; if (game.resultRefresh <= 0) { game.resultRefresh = 0.5; showResults(); } }
  }
  // 파티클
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt; if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; const dmp = Math.pow(0.03, dt); p.vx *= dmp; p.vy *= dmp;
  }
  for (let i = game.messages.length - 1; i >= 0; i--) { game.messages[i].t -= dt; if (game.messages[i].t <= 0) game.messages.splice(i, 1); }
  if (game.goFlash) game.goFlash = Math.max(0, game.goFlash - dt);
  game.shake = Math.max(0, (game.shake || 0) - dt * 30);

  // 카메라 (드리프트 시 진행 방향 쪽으로 살짝 늦게 따라감)
  const p = game.player, cam = game.cam;
  const sp = Math.hypot(p.vx, p.vy);
  const velA = sp > 60 && p.fwd > 0 ? Math.atan2(p.vy, p.vx) : p.h;
  const targetH = p.h + wrapA(velA - p.h) * 0.55;
  cam.h += wrapA(targetH - cam.h) * Math.min(1, dt * 4.5);
  cam.fov = lerp(cam.fov, 60 + Math.min(1, Math.abs(p.fwd) / MAX_SPEED) * 8 + (p.boost > 0 ? 9 : 0), Math.min(1, dt * 3));

  Sound.engine(p.fwd, game.state !== 'menu');
}

// ===================== 3D 렌더링 =====================
// 좌표계: 게임 평면 (x, y) → three.js (x, 높이, y). 카트 정면 = 로컬 +x.
const ROAD_Y = 1.0;
const Gfx = (() => {
  // 지정한 색상(hex)을 sRGB로 해석해 선형 공간으로 변환 (색이 바래 보이지 않도록)
  const _setHex = THREE.Color.prototype.setHex, _setStyle = THREE.Color.prototype.setStyle;

  THREE.Color.prototype.setStyle = function (st) { _setStyle.call(this, st); return /^#/.test(st) ? this.convertSRGBToLinear() : this; };
  const glCanvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, 1, 2, 16000);
  const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x55663f, 0.65);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
  sun.castShadow = true;
  const isMobile = /Mobi|Android|iPhone|iPad/.test(navigator.userAgent);
  sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -560, right: 560, top: 560, bottom: -560, near: 10, far: 3000 });
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.5;
  scene.add(sun, sun.target);
  const SUN_DIR = new THREE.Vector3(0.5, 1.0, 0.3).normalize();

  let trackGroup = null, sky = null, padTex = null, gantryLights = [], curTrack = null;
  const kartGroup = new THREE.Group(); scene.add(kartGroup);
  let kartViews = [];

  // ---------- 텍스처 ----------
  function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  function canvasTex(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;

      const s = sz * (0.5 + r());
      g.fillRect(r() * w, r() * h, s, s);
    }
  }
  function blotches(g, w, h, n, rgb, maxA, r) {
    for (let i = 0; i < n; i++) {
      const x = r() * w, y = r() * h, rad = 30 + r() * 110;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);

  // 카운트다운
  ctx.textAlign = 'center';
  if (game.state === 'countdown') {
    const c = Math.ceil(game.countdown);
    if (c <= 3) {
      const f = game.countdown - Math.floor(game.countdown);
      ctx.font = `italic bold ${Math.floor(110 + f * 50)}px sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillText(c, VW / 2 + 5, VH * 0.42 + 5);
      ctx.fillStyle = ['#ff5d73', '#ffd23f', '#7fdcff'][3 - c] || '#fff'; ctx.fillText(c, VW / 2, VH * 0.42);
    }
  } else if (game.goFlash > 0) {
    ctx.globalAlpha = game.goFlash;
    ctx.font = `italic bold ${Math.floor(130 + (1 - game.goFlash) * 60)}px sans-serif`;
    ctx.fillStyle = '#2ec4b6'; ctx.fillText('GO!', VW / 2, VH * 0.42);
    ctx.globalAlpha = 1;
  }
  // 메시지
  game.messages.forEach((m, i) => {
    const a = Math.min(1, m.t / 0.3);
    ctx.globalAlpha = a;
    ctx.font = `italic bold ${small ? 26 : 36}px sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(m.text, VW / 2 + 3, VH * 0.28 + i * 44 + 3);
    ctx.fillStyle = m.color; ctx.fillText(m.text, VW / 2, VH * 0.28 + i * 44);
    ctx.globalAlpha = 1;
  });
  if (p.wrongWay > 0.8 && !p.finished && Math.floor(performance.now() / 300) % 2) {
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = '#ff3b3b'; ctx.fillText('⚠ 역주행!', VW / 2, VH * 0.2);
  }
}

// ===================== 결과 / 메뉴 UI =====================
function showResults() {
  const el = document.getElementById('result');
  const p = game.player;
  const rank = ranking();
  const pos = game.finishOrder.indexOf(p) + 1;
  document.getElementById('resTitle').textContent = pos === 1 ? '🏆 우승!' : `${pos}등 완주!`;
  let html = '<tr><th>순위</th><th>이름</th><th>기록</th><th>베스트 랩</th></tr>';
  rank.forEach((k, i) => {
    const best = k.lapTimes.length ? Math.min(...k.lapTimes) : 0;
    html += `<tr class="${k.isPlayer ? 'me' : ''}"><td>${i + 1}</td><td><span style="color:${k.color}">●</span> ${k.name}</td><td>${k.finished ? fmt(k.finishTime) : '주행 중'}</td><td>${fmt(best)}</td></tr>`;
  });
  if (game.newRecord) html += `<tr><td colspan="4" style="color:#ffd23f">✨ 신기록! ${fmt(p.finishTime)}</td></tr>`;
  document.getElementById('resTable').innerHTML = html;
  el.classList.remove('hidden');
}

function buildMenu() {
  const mk = (id, items, key, render) => {
    const box = document.getElementById(id); box.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.className = 'opt' + (settings[key] === i ? ' sel' : '');
      render(b, it);
      b.onclick = () => { settings[key] = i; buildMenu(); if (game.state === 'menu') setupRace(); };
      box.appendChild(b);
    });
  };
  mk('trackSel', TRACKS, 'track', (b, t) => { b.textContent = t.name; });
  mk('colorSel', COLORS, 'color', (b, c) => { b.classList.add('swatch'); b.style.background = c; });
  mk('diffSel', DIFFS, 'diff', (b, d) => { b.textContent = d.name; });
}
document.getElementById('startBtn').onclick = startRace;
document.getElementById('againBtn').onclick = startRace;
document.getElementById('menuBtn').onclick = showMenu;
buildMenu();

// 메뉴 배경: 출발 그리드에 선 카트들
setupRace();

// ===================== 메인 루프 =====================
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = clamp(dt, 0, 0.05);
  if (game.state !== 'menu') {
    // 고정 스텝 물리
    const steps = Math.ceil(dt / (1 / 120));
    for (let s = 0; s < steps; s++) update(dt / steps);
  }
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
